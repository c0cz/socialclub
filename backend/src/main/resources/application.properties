spring.application.name=socialclub

spring.datasource.url=jdbc:mysql://localhost:3306/socialclub?createDatabaseIfNotExist=true&serverTimezone=America/Argentina/Cordoba
spring.datasource.username=root
spring.datasource.password=3333
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
#espera a que Hibernate cree las tablas y recién después corre el SQL.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8