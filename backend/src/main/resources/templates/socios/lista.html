<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Socios</title>
  <link rel="stylesheet" th:href="@{/css/backoffice.css}">
</head>
<body>
  <div th:replace="~{fragments/layout :: encabezado}"></div>

  <main>
    <h2>Socios</h2>

    <p class="ok" th:if="${mensaje}" th:text="${mensaje}"></p>
    <p class="error" th:if="${error}" th:text="${error}"></p>

    <form th:action="@{/socios}" method="get" class="busqueda">
      <input type="text" name="apellido" th:value="${apellido}" placeholder="Buscar por apellido">
      <button type="submit">Buscar</button>
      <a th:href="@{/socios}">Limpiar</a>
    </form>

    <a class="boton" th:href="@{/socios/nuevo}">+ Nuevo socio</a>

    <table>
      <thead>
        <tr>
          <th>DNI</th>
          <th>Apellido y nombre</th>
          <th>Nacimiento</th>
          <th>Email</th>
          <th>Cuota</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="s : ${socios}">
          <td th:text="${s.dni}"></td>
          <td th:text="${s.apellido} + ', ' + ${s.nombre}"></td>
          <td th:text="${#temporals.format(s.fechaNacimiento, 'dd/MM/yyyy')}"></td>
          <td th:text="${s.email}"></td>
          <td th:text="${s.estadoCuota}" th:classappend="${s.estadoCuota.name() == 'MOROSO'} ? 'error'"></td>
          <td><a th:href="@{/socios/{id}/editar(id=${s.id})}">Editar</a></td>
        </tr>
        <tr th:if="${#lists.isEmpty(socios)}">
          <td colspan="6">No se encontraron socios.</td>
        </tr>
      </tbody>
    </table>

    <div class="paginas" th:if="${totalPaginas > 1}">
      <a th:each="i : ${#numbers.sequence(0, totalPaginas - 1)}"
         th:href="@{/socios(pagina=${i}, apellido=${apellido})}"
         th:text="${i + 1}"
         th:classappend="${i == pagina} ? 'actual'"></a>
    </div>
  </main>

  <div th:replace="~{fragments/layout :: pie}"></div>
</body>
</html>
